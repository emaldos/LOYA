<!DOCTYPE html>
<html data-theme="dark" data-style="glass">
<head>
<meta charset="utf-8">
<title>LOYA NG Mini</title>
<link rel="stylesheet" href="../css/theme.css">
<link rel="stylesheet" href="../css/base.css">
<link rel="stylesheet" href="../css/components.css">
<link rel="stylesheet" href="../css/windows/mini.css">
<link rel="stylesheet" href="../css/glass.css">
<script src="../js/appearance-boot.js"></script>
</head>
<body>
<div class="mini-shell">
<div class="mini-frame glass-panel">
<div class="mini-topbar" id="miniTopbar">
<div class="mini-tabs" id="miniTabs">
<button type="button" class="mini-tab active" data-tab="commands" title="Commands">Commands</button>
<button type="button" class="mini-tab" data-tab="targets" title="Targets">Targets</button>
<button type="button" class="mini-tab" data-tab="quick" title="Quick Space">Quick Space</button>
</div>
<span class="mini-collapsed-label" id="miniCollapsedLabel">LOYA NG Mini</span>
<div class="mini-controls">
<button type="button" class="mini-ctrl-btn" id="miniCollapseBtn" title="Close preview"><i class="icon icon-arrow-up"></i></button>
<button type="button" class="mini-ctrl-btn" id="miniRestoreBtn" title="Expand to original view"><i class="icon icon-fullscreen"></i></button>
<button type="button" class="mini-ctrl-btn" id="miniPinBtn" title="Pin on top"><i class="icon icon-pin"></i></button>
<button type="button" class="mini-ctrl-btn mini-ctrl-close" id="miniCloseBtn" title="Quit LOYA NG"><i class="icon icon-close"></i></button>
</div>
</div>
<div class="mini-body" id="miniBody">
<div class="mini-page active" data-page="commands">
<div class="mini-toolbar">
<input type="text" id="miniCmdSearch" class="mini-input" placeholder="Search commands...">
<button type="button" class="mini-fav-btn" id="miniCmdFavBtn" title="Favorites only"><i class="icon icon-star"></i></button>
</div>
<div class="mini-table-wrap"><table class="mini-table"><tbody id="miniCmdTableBody"></tbody></table></div>
<div class="mini-status-bar"><span class="mini-status-dot" id="miniStatusDot"></span><span id="miniStatusText">Live</span><span class="mini-status-target" id="miniStatusTarget"></span></div>
</div>
<div class="mini-page" data-page="targets">
<div class="mini-toolbar"><input type="text" id="miniTgtSearch" class="mini-input" placeholder="Search targets..."></div>
<div class="mini-table-wrap"><table class="mini-table"><tbody id="miniTgtTableBody"></tbody></table></div>
</div>
<div class="mini-page" data-page="quick">
<div class="mini-quick-searchbar hidden" id="miniQuickSearchBar">
<input type="text" id="miniQuickSearchInput" class="mini-input" placeholder="Find...">
<button type="button" class="mini-quick-nav-btn" id="miniQuickPrev" title="Previous">&lt;</button>
<button type="button" class="mini-quick-nav-btn" id="miniQuickNext" title="Next">&gt;</button>
<span class="mini-quick-count" id="miniQuickCount"></span>
<button type="button" class="mini-quick-nav-btn" id="miniQuickSearchClose" title="Close search">&times;</button>
</div>
<div class="mini-quick-body" id="miniQuickBody" contenteditable="true"></div>
<div class="mini-quick-toolbar">
<button type="button" class="mini-tb-btn" data-cmd="bold" title="Bold"><i class="icon icon-bold"></i></button>
<button type="button" class="mini-tb-btn" data-cmd="italic" title="Italic"><i class="icon icon-italic"></i></button>
<button type="button" class="mini-tb-btn" data-cmd="underline" title="Underline"><i class="icon icon-underline"></i></button>
<button type="button" class="mini-tb-btn" id="miniQuickListBtn" title="Bulleted list"><i class="icon icon-list"></i></button>
<button type="button" class="mini-tb-btn" id="miniQuickFindBtn" title="Find (Ctrl+F)"><i class="icon icon-search"></i></button>
<button type="button" class="mini-tb-btn active" id="miniQuickWrapBtn" title="Word wrap"><i class="icon icon-align-left"></i></button>
<span class="mini-toolbar-sep"></span>
<span class="mini-save-mark" id="miniSaveMark"></span>
<button type="button" class="mini-tb-btn" id="miniQuickSaveBtn" title="Save (Ctrl+S)"><i class="icon icon-save"></i></button>
</div>
</div>
</div>
<div class="mini-lock-overlay hidden" id="miniLockOverlay">
<div class="mini-lock-title">LOYA NG is locked</div>
<button type="button" class="mini-lock-btn" id="miniLockUnlockBtn">Unlock in main window</button>
</div>
</div>
<div class="mini-resize-handle" id="miniResizeHandle" title="Resize"></div>
</div>
<script src="../js/bridge.js"></script>
<script src="../js/components/nav-guard.js"></script>
<script src="../js/components/theme.js"></script>
<script src="../js/components/toast.js"></script>
<script src="../js/components/context-menu.js"></script>
<script src="../js/pages/notes_pro_core.js"></script>
<script src="../js/windows/mini.js"></script>
</body>
</html>
